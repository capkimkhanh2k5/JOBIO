name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/jobio-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/jobio-frontend
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-backend:
    name: 🐳 Build Backend Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: 🐳 Build Frontend Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate required variables
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::error::VITE_API_BASE_URL must be set in repository variables (Settings → Variables)"
            exit 1
          fi

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_SYSTEM_LOGO_URL=${{ vars.VITE_SYSTEM_LOGO_URL || 'https://res.cloudinary.com/dbkxwc5gr/image/upload/v1773671098/system_assets/main_logo.png' }}

  deploy:
    name: 🚀 Deploy to GCP VM
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Sync Docker Compose file
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USERNAME: ${{ secrets.GCP_VM_USERNAME }}
          GCP_VM_SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
          ROOT_ENV_FILE: ${{ secrets.ROOT_ENV_FILE }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          if [ -z "$ROOT_ENV_FILE" ]; then
            echo "::error::ROOT_ENV_FILE must be set in repository secrets"
            exit 1
          fi

          if [ -z "$BACKEND_ENV_FILE" ]; then
            echo "::error::BACKEND_ENV_FILE must be set in repository secrets"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$GCP_VM_SSH_KEY" | tr -d '\r' > ~/.ssh/jobio_deploy_key
          chmod 600 ~/.ssh/jobio_deploy_key
          trap 'rm -f ~/.ssh/jobio_deploy_key' EXIT
          ssh -i ~/.ssh/jobio_deploy_key -o StrictHostKeyChecking=accept-new "$GCP_VM_USERNAME@$GCP_VM_HOST" 'mkdir -p ~/jobio/backend'
          scp -i ~/.ssh/jobio_deploy_key -o StrictHostKeyChecking=accept-new docker-compose.prod.yml "$GCP_VM_USERNAME@$GCP_VM_HOST:~/jobio/docker-compose.yml"
          printf '%s\n' "$ROOT_ENV_FILE" | ssh -i ~/.ssh/jobio_deploy_key -o StrictHostKeyChecking=accept-new "$GCP_VM_USERNAME@$GCP_VM_HOST" "umask 177 && cat > ~/jobio/.env"
          printf '%s\n' "$BACKEND_ENV_FILE" | ssh -i ~/.ssh/jobio_deploy_key -o StrictHostKeyChecking=accept-new "$GCP_VM_USERNAME@$GCP_VM_HOST" "umask 177 && cat > ~/jobio/backend/.env"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -euo pipefail

            cd ~/jobio

            if [ -f .env ]; then
              set -a
              . ./.env
              set +a
            fi

            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            PREVIOUS_TAG=""
            if [ -f .deployed-image-tag ]; then
              PREVIOUS_TAG="$(cat .deployed-image-tag)"
            fi

            rollback() {
              status=$?
              trap - ERR
              echo "Deploy failed with status ${status}."

              if [ -n "${PREVIOUS_TAG}" ]; then
                echo "Rolling back to ${PREVIOUS_TAG}."
                export IMAGE_TAG="${PREVIOUS_TAG}"
                docker compose pull backend celery-worker frontend || true
                docker compose up -d || true
                verify_health || true
              else
                echo "No previous image tag found; rollback skipped."
              fi

              exit "${status}"
            }

            wait_for_url() {
              name="$1"
              url="$2"

              for attempt in $(seq 1 30); do
                if curl -fsS "$url" >/dev/null; then
                  echo "${name} is healthy."
                  return 0
                fi

                echo "Waiting for ${name} healthcheck (${attempt}/30)."
                sleep 5
              done

              docker compose ps
              docker compose logs --tail=100 backend frontend
              return 1
            }

            verify_health() {
              wait_for_url "backend" "http://localhost:8000/health/"
              wait_for_url "frontend" "http://localhost/health"
            }

            trap rollback ERR

            : "${POSTGRES_DB:?POSTGRES_DB is required in ~/jobio/.env}"
            : "${POSTGRES_USER:?POSTGRES_USER is required in ~/jobio/.env}"

            docker compose pull
            docker compose up -d postgres redis

            for attempt in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "Postgres did not become ready."
                exit 1
              fi

              sleep 2
            done

            mkdir -p backups
            BACKUP_FILE="backups/pre-deploy-${IMAGE_TAG}-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            docker compose exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip > "$BACKUP_FILE"

            docker compose run --rm backend python manage.py migrate --noinput
            docker compose up -d

            verify_health
            printf '%s\n' "$IMAGE_TAG" > .deployed-image-tag
            docker image prune -f
