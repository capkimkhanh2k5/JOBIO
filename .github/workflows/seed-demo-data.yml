name: Seed Demo Data

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEED_DEMO_DATA to confirm production data seeding
        required: true
      reset_existing_data:
        description: Flush existing database data before import
        required: true
        type: boolean
        default: false

concurrency:
  group: seed-demo-data-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seed-demo-data:
    name: Seed demo data on GCP VM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Validate seed request and data
        run: |
          if [ "${{ inputs.confirmation }}" != "SEED_DEMO_DATA" ]; then
            echo "::error::Confirmation must be exactly SEED_DEMO_DATA"
            exit 1
          fi

          export SEED_DATA_DIR="DataSet/Data_Final"
          if [ ! -d "$SEED_DATA_DIR" ]; then
            echo "::error::Missing DataSet/Data_Final"
            exit 1
          fi

          echo "SEED_DATA_DIR=${SEED_DATA_DIR}" >> "$GITHUB_ENV"
          test -f backend/scripts/load_production_seed_data.py

          for file in users.json addresses.json industries.json companies.json jobs.json applications.json transactions.json company_subscriptions.json; do
            if [ ! -f "${SEED_DATA_DIR}/${file}" ]; then
              echo "::error::Missing required seed file: ${file}"
              exit 1
            fi
          done

          python3 <<'PY'
          import json
          import os
          import sys
          from collections import defaultdict
          from pathlib import Path

          data_dir = Path(os.environ["SEED_DATA_DIR"])
          checks = [
              ("jobs.json", ("slug",), None),
              ("recruiter_languages.json", ("recruiter_id", "language_id"), None),
              (
                  "company_subscriptions.json",
                  ("company_id",),
                  lambda row: row.get("status") == "active",
              ),
              ("saved_jobs.json", ("recruiter_id", "job_id"), None),
              ("job_locations.json", ("job_id", "address_id"), None),
              ("user_passkeys.json", ("credential_id",), None),
          ]

          errors = []
          for filename, fields, predicate in checks:
              path = data_dir / filename
              if not path.exists():
                  continue

              with path.open("r", encoding="utf-8-sig") as handle:
                  rows = json.load(handle)

              groups = defaultdict(list)
              for row in rows:
                  if predicate and not predicate(row):
                      continue

                  key = tuple(row.get(field) for field in fields)
                  groups[key].append(row.get("id"))

              for key, ids in groups.items():
                  if len(ids) > 1:
                      errors.append(
                          f"{filename}: fields={fields}, value={key}, ids={ids}"
                      )

          if errors:
              print("Found duplicate seed data:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          PY

      - name: Upload seed data to VM
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USERNAME: ${{ secrets.GCP_VM_USERNAME }}
          GCP_VM_SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GCP_VM_SSH_KEY" | tr -d '\r' > ~/.ssh/jobio_deploy_key
          chmod 600 ~/.ssh/jobio_deploy_key
          trap 'rm -f ~/.ssh/jobio_deploy_key seed-data.tgz' EXIT

          tar -czf seed-data.tgz -C "$SEED_DATA_DIR" .

          ssh -i ~/.ssh/jobio_deploy_key -o StrictHostKeyChecking=accept-new "$GCP_VM_USERNAME@$GCP_VM_HOST" \
            'mkdir -p ~/jobio/seed && rm -rf ~/jobio/seed/Data_To_Load && rm -f ~/jobio/seed/load_production_seed_data.py'
          scp -i ~/.ssh/jobio_deploy_key -o StrictHostKeyChecking=accept-new seed-data.tgz \
            "$GCP_VM_USERNAME@$GCP_VM_HOST:~/jobio/seed/seed-data.tgz"
          scp -i ~/.ssh/jobio_deploy_key -o StrictHostKeyChecking=accept-new backend/scripts/load_production_seed_data.py \
            "$GCP_VM_USERNAME@$GCP_VM_HOST:~/jobio/seed/load_production_seed_data.py"

      - name: Import seed data on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESET_EXISTING_DATA: ${{ inputs.reset_existing_data }}
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          command_timeout: 45m
          envs: RESET_EXISTING_DATA
          script: |
            set -euo pipefail

            cd ~/jobio

            if [ ! -f .env.production ]; then
              echo "::error::~/jobio/.env.production is missing. Run CD first or update ROOT_ENV_FILE."
              exit 1
            fi

            set -a
            . ./.env.production
            set +a

            if [ -f .deployed-image-tag ]; then
              export IMAGE_TAG="$(cat .deployed-image-tag)"
            fi

            : "${POSTGRES_DB:?POSTGRES_DB is required in ~/jobio/.env.production}"
            : "${POSTGRES_USER:?POSTGRES_USER is required in ~/jobio/.env.production}"
            : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in ~/jobio/.env.production}"

            compose() {
              docker compose --env-file .env.production "$@"
            }

            wait_for_postgres() {
              for attempt in $(seq 1 30); do
                if compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                  return 0
                fi

                echo "Waiting for postgres (${attempt}/30)."
                sleep 2
              done

              echo "Postgres did not become ready."
              return 1
            }

            database_auth_ok() {
              compose exec -T -e PGPASSWORD="$POSTGRES_PASSWORD" postgres \
                psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select 1" >/dev/null 2>&1
            }

            backend_runtime_db_env_ok() {
              compose run --rm --no-deps -T \
                -e EXPECTED_DB_NAME="$POSTGRES_DB" \
                -e EXPECTED_DB_USER="$POSTGRES_USER" \
                -e EXPECTED_DB_PASSWORD="$POSTGRES_PASSWORD" \
                backend sh -c '
                  failed=""
                  [ "$DB_NAME" = "$EXPECTED_DB_NAME" ] || failed="$failed DB_NAME"
                  [ "$DB_USER" = "$EXPECTED_DB_USER" ] || failed="$failed DB_USER"
                  [ "$DB_PASSWORD" = "$EXPECTED_DB_PASSWORD" ] || failed="$failed DB_PASSWORD"
                  [ "$DB_HOST" = "postgres" ] || failed="$failed DB_HOST"
                  [ "$DB_PORT" = "5432" ] || failed="$failed DB_PORT"

                  if [ -n "$failed" ]; then
                    echo "::error::Backend runtime database environment does not match production root env:$failed"
                    exit 1
                  fi

                  echo "Backend runtime database environment matches production root env."
                '
            }

            wait_for_url() {
              name="$1"
              url="$2"

              for attempt in $(seq 1 30); do
                if curl -fsS --resolve jobio.id.vn:443:127.0.0.1 "$url" >/dev/null; then
                  echo "${name} is healthy."
                  return 0
                fi

                echo "Waiting for ${name} healthcheck (${attempt}/30)."
                sleep 5
              done

              compose ps
              compose logs --tail=100 backend frontend caddy
              return 1
            }

            verify_health() {
              wait_for_url "backend" "https://jobio.id.vn/health/"
              wait_for_url "frontend" "https://jobio.id.vn/health"
            }

            restore_services() {
              status=$?
              trap - EXIT
              compose up -d || true

              if [ "$status" -eq 0 ]; then
                verify_health
              fi

              exit "$status"
            }

            mkdir -p seed
            rm -rf seed/Data_To_Load
            mkdir -p seed/Data_To_Load
            tar -xzf seed/seed-data.tgz -C seed/Data_To_Load

            compose up -d postgres redis

            wait_for_postgres

            if ! database_auth_ok; then
              echo "::error::Postgres is healthy but password authentication failed. Ensure ROOT_ENV_FILE.POSTGRES_PASSWORD matches the database volume password."
              exit 1
            fi

            backend_runtime_db_env_ok

            compose run --rm -T backend python manage.py migrate --check

            mkdir -p backups
            BACKUP_FILE="backups/pre-seed-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            compose exec -T -e PGPASSWORD="$POSTGRES_PASSWORD" postgres \
              pg_dump -h postgres -U "$POSTGRES_USER" "$POSTGRES_DB" | gzip > "$BACKUP_FILE"

            trap restore_services EXIT
            compose stop backend celery-worker celery-beat || true

            if [ "$RESET_EXISTING_DATA" = "true" ]; then
              compose run --rm -T backend python manage.py flush --noinput
            fi

            compose run --rm -T \
              -v "$PWD/seed/Data_To_Load:/seed/Data_Final:ro" \
              -v "$PWD/seed/load_production_seed_data.py:/app/scripts/load_production_seed_data.py:ro" \
              backend python scripts/load_production_seed_data.py /seed/Data_Final

            printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .seeded-demo-data
